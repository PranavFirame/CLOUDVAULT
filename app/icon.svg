<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5B874"/>
      <stop offset="100%" stop-color="#E08630"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1c22"/>
      <stop offset="100%" stop-color="#101013"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F09E4F" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container with soft rounded corners -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#F09E4F" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Shield Shape -->
  <path d="M32 12L47 17.5V29C47 39.5 40.5 48.5 32 52C23.5 48.5 17 39.5 17 29V17.5L32 12Z"
        fill="url(#shieldGrad)"
        filter="url(#glow)"/>

  <!-- Inner Vault Shield Inset -->
  <path d="M32 15.5L44 19.9V29C44 37.8 38.8 45.4 32 48.5C25.2 45.4 20 37.8 20 29V19.9L32 15.5Z"
        fill="#131316"/>

  <!-- Lock Shackle -->
  <path d="M28 29V26C28 23.7909 29.7909 22 32 22C34.2091 22 36 23.7909 36 26V29"
        stroke="url(#shieldGrad)"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <!-- Lock Body -->
  <rect x="25.5" y="29" width="13" height="11" rx="2.5" fill="url(#shieldGrad)"/>

  <!-- Keyhole -->
  <circle cx="32" cy="33.5" r="1.5" fill="#131316"/>
  <path d="M31.25 33.5H32.75L33.25 37.5H30.75L31.25 33.5Z" fill="#131316"/>
</svg>
