<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1c22"/>
      <stop offset="100%" stop-color="#111114"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F09E4F" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F09E4F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="4" y1="2" x2="20" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5B874"/>
      <stop offset="100%" stop-color="#E08630"/>
    </linearGradient>
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#F09E4F" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle container matching CloudVault logo badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#amberGlow)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="#F09E4F" stroke-opacity="0.35" stroke-width="1.75"/>

  <!-- Official CloudVault Lucide Shield Icon -->
  <g transform="translate(11.6, 11.5) scale(1.7)" filter="url(#shieldShadow)">
    <path
      d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
      fill="#F09E4F"
      fill-opacity="0.16"
      stroke="url(#shieldGrad)"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
